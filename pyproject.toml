[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-bridge"
version = "0.1.0"
description = "Authenticated MCP consultations and authorized project work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1,<2", "anthropic", "uvicorn"]

[tool.setuptools.packages.find]
include = ["model_bridge*"]
